services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: minicpm2b-n100
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Monta la cartella locale dei modelli all'interno del container
      - ./models:/models:ro
    # Passthrough memoria bloccata per consentire --mlock senza memory swap
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ipc: host
    command: >
      -m /models/minicpm-2b-q4_k_m.gguf
      -t 4
      --threads-batch 4
      -c 2048
      -b 512
      -ub 256
      --mlock
      --min-p 0.0
      --jinja
      --host 0.0.0.0
      --port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
