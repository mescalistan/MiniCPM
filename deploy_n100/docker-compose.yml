services:
  llama-server:
    image: minicpm-llama-server:n100-vnni
    container_name: minicpm2b-n100
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /home/gabibbo/minicpm/models:/models:ro
    cpus: "3.6"
    mem_limit: 3500m
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ipc: host
    command: >
      -m /models/minicpm-2b-q4_k_m.gguf
      --alias minicpm-2b,minicpm,minicpm-custom
      -t 3
      --threads-batch 3
      -c 4096
      -b 512
      -ub 256
      -np 2
      --cache-reuse 64
      -fa on
      --load-mode mlock
      --min-p 0.05
      --jinja
      --host 0.0.0.0
      --port 8080
      --prio 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - home-server_local-net

networks:
  home-server_local-net:
    external: true
