services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: minicpm2b-n100
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Monta la cartella locale dei modelli all'interno del container
      - ./models:/models:ro
    cpus: "3.2"
    mem_limit: 2800m
    # Passthrough memoria bloccata per consentire --load-mode mlock senza memory swap
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ipc: host
    command: >
      -m /models/minicpm-2b-q4_k_m.gguf
      --alias minicpm-2b,minicpm,minicpm-custom
      -t 3
      --threads-batch 3
      -c 2048
      -b 512
      -ub 256
      -np 1
      --cache-reuse 64
      -fa on
      -ctk q8_0
      -ctv q8_0
      --load-mode mlock
      --min-p 0.0
      --jinja
      --host 0.0.0.0
      --port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - home-server_local-net

networks:
  home-server_local-net:
    external: true
